# Tomodachi LLM bridge config. Copy to config.toml (gitignored) and edit.
# Secrets never go here: OPENROUTER_API_KEY / LMSTUDIO_API_TOKEN come from the environment.

[server]
# How the plugin and the bridge talk (same setting as `transport` in the plugin's config.ini):
#   "file"    (default) through files on the emulator's SD card folder. Emulators run the game's socket
#             calls one at a time (~1 s each on Ryujinx 1.3.351); file I/O avoids that.
#   "socket"  TCP; the plugin connects to host:port.
transport = "file"
# The emulator's SD card folder + "/tomodachi-llm" (the plugin creates it on first run). Ryujinx on macOS:
#   ~/Library/Application Support/Ryujinx/sdcard/tomodachi-llm    Windows: the full path, e.g. C:/Users/<you>/AppData/Roaming/Ryujinx/sdcard/tomodachi-llm
file_dir = "~/Library/Application Support/Ryujinx/sdcard/tomodachi-llm"
poll_ms = 20            # how often the bridge checks for new plugin messages
host = "127.0.0.1"      # socket transport: where the plugin connects (IP literal in the plugin's config.ini)
port = 8765
log_dir = "logs"   # session event logs; relative paths (here and line_store) are next to this file

[generation]
# Which LLM to use. You pick local (LM Studio) or cloud (OpenRouter):
#   "auto"        use whichever of [lmstudio] / [openrouter] below is configured. If both are, LM Studio
#                 is used first and OpenRouter is the fallback when LM Studio fails or is unreachable.
#   "lmstudio"    LM Studio first; OpenRouter as fallback only if it is configured too.
#   "openrouter"  OpenRouter first; LM Studio as fallback only if it is configured too.
#   "mock"        no LLM (canned lines; for testing).
# "Configured": [lmstudio] has base_url and model; [openrouter] has a model AND its API key is set in the
# environment ($OPENROUTER_API_KEY). To use only one, leave the other's base_url empty or its key unset,
# or set fallback = false.
backend = "auto"
fallback = true
# Generate a fresh version of each Mii line (up to 4 speech balloons) the first time the game shows it; the plugin
# plays it the next time that line comes up (needs reline=1 in the plugin's config.ini).
relines = true
# Each time a generated line is played, generate another one for the following time, so repeated lines keep
# changing. One model call per line shown: free with LM Studio, paid with OpenRouter.
reline_refresh = true
# Keep generated lines between game sessions in this file and send them to the plugin when the game starts
# (plugin 0.6.0+), so lines seen in earlier sessions play generated text from their first showing. Up to
# line_store_max lines per language (the least recently used are dropped). "" = don't keep them.
line_store = "lines.json"
line_store_max = 4000
# Befriend conversations: once the bridge knows which scripted scene is playing, write all its remaining lines in
# one call so they form one dialogue (needs plugin 0.4.0+). One bigger call per conversation.
scenes = true
scene_deadline_s = 15.0
# Lines 00-01 of befriend scenes are written ahead, in the background, this many seconds after the game has
# loaded the scripts (and again after each conversation).
scene_warm_delay_s = 5.0
deadline_s = 8.0        # hard per-conversation deadline across all attempts; past it the plugin plays vanilla
cache_size = 512

[mock]
mode = "template"       # "template" (echo vanilla with a marker) | "fail" | "malformed"
delay_s = 0.2

[lmstudio]
base_url = "http://127.0.0.1:1234/v1"   # LM Studio on another machine: its LAN IP, with LM Studio auth on
model = "google/gemma-4-26b-a4b"        # best in docs/model-benchmarks.md (2026-10-09); must be loaded (lms ps)
api_key_env = "LMSTUDIO_API_TOKEN"      # optional; only needed when LM Studio auth is on
timeout_s = 6.0          # per attempt; leaves time for the fallback inside deadline_s
# Thinking off: with it on, Qwen3.6 spent its whole token budget reasoning and returned nothing (2026-10-09).
extra_body = { reasoning_effort = "none" }

[openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemma-4-26b-a4b-it"     # best in docs/model-benchmarks.md (2026-10-11); deepseek/deepseek-v4.1-flash is the fastest
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 20.0
# Spend cap in US dollars: the bridge (and the benchmark) add up what each OpenRouter call costs and make no
# more paid calls once the total reaches it (LM Studio or the game's own line is used instead). The total is
# kept in spend_file (relative paths are next to this config file); raise the cap or delete the file to
# allow more.
spend_cap_usd = 5.0
spend_file = "openrouter-spend.json"
# Extra request body fields (OpenRouter routing / reasoning), passed through as-is.
extra_body = { provider = { require_parameters = true, sort = "latency" }, reasoning = { effort = "none" } }
