[project]
name = "tomodachi-llm-bridge"
version = "0.1.0"
description = "Host-side bridge for the Tomodachi LLM mod: receives the plugin's events, generates lines with an OpenAI-compatible LLM, validates them and pushes them back."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
