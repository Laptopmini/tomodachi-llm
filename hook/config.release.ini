# Tomodachi LLM plugin config (release defaults: diagnostics off). Lives in <mod>/romfs/tomodachi-llm/config.ini.
# How to talk to the bridge: "file" (default) through sd:/tomodachi-llm/out.jsonl and sd:/tomodachi-llm/in.jsonl on the emulator's
# SD card, or "socket" (TCP to host:port). Emulators run socket calls one at a time (~1 s each on Ryujinx).
transport=file
# Play the bridge's generated version of a Mii line the next time the game shows that line. 0 = vanilla only.
reline=1
# Socket transport: bridge address, an IP literal (never a hostname). Leave port empty to disable it.
host=127.0.0.1
port=8765
# Also write every event to the emulator log (svcOutputDebugString). Noisy; 1 = on.
debug_log=0
hook_labels=1
hook_lines=1
# Also read whole files through the MessageShuffler's label lookups (chat captions, `scripts=`). 0 = off
hook_index=0
# Log Mii-to-Mii chat setup and captions (ScenarioChatSelector, SetGroupFocusTelopSelector). Observation only; 0 = off.
hook_chat=0
# Read messages from the bridge (welcome, pong): one non-blocking Recv per worker loop. 0 = send only.
rx=1
# Add a call-stack backtrace to dialogue line events (diagnostics). 0 = off.
backtrace=0
# Label prefixes of whole message files to read ahead (comma-separated, up to 4): the first time the game looks up
# a label with one of them, the plugin reports every label of that file with the prefix, so the bridge knows
# lines before they are shown. FriendUgc_ = befriend scripts; EmotionTelopChat_ and FocusLeadingChat1_ = chat
# captions (plugin 0.6.1+). Empty = off.
scripts=FriendUgc_
